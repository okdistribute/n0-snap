[package]
name = "flicker"
version = "0.1.0"
edition = "2024"
default-run = "flicker"

[features]
default = ["desktop"]
desktop = ["dep:dioxus", "dioxus/desktop", "dep:rfd", "dep:reqwest", "dep:qrcode"]

[dependencies]
anyhow = "1"
iroh = "=1.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
dioxus = { version = "0.7", optional = true }
rfd = { version = "0.15", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }

[[bin]]
name = "flicker"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "flicker-store"
path = "src/store_main.rs"
